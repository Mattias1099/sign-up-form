<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main">
        <div class="left-section">
            <div class="background-div">
                <img class="background-img" src="img/background-img.jpg" alt="">
            </div>
        </div>
        <div class="right-section">
            <div class="header-section">
                <p>This is not a real online service! You know you need something 
                    like this in your life to help you realize your deepest dreams.
                    <br>Sign up <i>now</i> to get started.
                </p>
                <p>
                    You <i>know</i> you want to.
                </p>
            </div>
            <div class="form-section">
                <p>Let's do this!</p>
                <form id="form" action="#" method="post">
                    <div class="form-field">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name">
                    </div>
                    <div class="form-field">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                    <div class="form-field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="user_email">
                    </div>
                    <div class="form-field">
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" id="phone_number" name="user_phone_number">
                    </div>
                    <div class="form-field">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" minlength="8">
                    </div>
                    <div class="form-field">
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input type="password" id="password" name="confirm_password" minlength="8">
                    </div>
                </form>
                </div>


            <div class="bottom-section">
                <button type="submit" form="form">Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>
        </div>
    </div>
    
</body>
</html>
